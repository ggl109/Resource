<style>
:root{--bg:#fff8f4;--card:#fff;--soft:#fff0ec;--pink:#f36b78;--yellow:#f4c85c;--ink:#3f302f;--muted:#8b7471;--line:#eedbd5;--ok:#6bcf9d}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fffaf7,#fff5f3);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent}.app{max-width:680px;margin:auto;padding:14px 12px 92px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 10px 28px rgba(123,78,70,.09)}h1{font-size:22px;margin:0 0 5px}h2{font-size:17px;margin:0 0 12px}.muted{color:var(--muted);font-size:13px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{font-size:12px;padding:5px 9px;border-radius:999px;background:var(--soft);color:#a24c55}.mascot{width:66px;height:66px;position:relative;flex:0 0 66px;animation:float 2.8s ease-in-out infinite}.star{position:absolute;inset:2px 5px 8px;background:#ffe6af;clip-path:polygon(50% 0,61% 31%,96% 31%,68% 51%,79% 86%,50% 65%,21% 86%,32% 51%,4% 31%,39% 31%)}.face{position:absolute;left:20px;top:27px;width:27px;height:18px}.eye{position:absolute;top:1px;width:4px;height:6px;background:#493735;border-radius:50%}.eye.l{left:4px}.eye.r{right:4px}.mouth{position:absolute;left:9px;top:9px;width:9px;height:5px;border-bottom:2px solid #6d504d;border-radius:50%}@keyframes float{50%{transform:translateY(-6px)}}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{background:#fffaf4;border:1px solid var(--line);border-radius:15px;padding:10px;text-align:center}.stat b{display:block;font-size:21px;color:#cf4f5e}.progress{height:11px;background:#f3e4df;border-radius:999px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--yellow));width:0;transition:.3s}.map{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.dot{aspect-ratio:1;border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--muted)}.dot.today{outline:4px solid rgba(243,107,120,.16);border-color:var(--pink)}.dot.done{background:var(--yellow);color:#614700}.task{border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:9px}.task.done{background:#fff9ec}.task-head{display:flex;align-items:flex-start;gap:9px}.task input{width:22px;height:22px;accent-color:var(--pink)}.level{font-size:11px;padding:4px 7px;border-radius:999px;background:#ffe2e7;color:#ad394a}.task b{display:block;font-size:15px}.task p{margin:5px 0 0;color:var(--muted);font-size:13px;line-height:1.5}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}button{font:inherit;cursor:pointer}.btn{min-height:43px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink)}.btn.primary{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:700}.btn.undo{background:#fff5d7;color:#795b0d}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);width:min(430px,calc(100% - 24px));padding:12px;background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 12px 30px rgba(0,0,0,.13);opacity:0;pointer-events:none;transition:.2s;display:flex;justify-content:space-between;align-items:center;z-index:9}.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}.toast button{border:0;background:var(--pink);color:#fff;border-radius:9px;padding:7px 10px}.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:7px 7px calc(7px + env(safe-area-inset-bottom));z-index:8}.nav button{border:0;background:transparent;color:var(--muted);padding:6px;font-size:12px}.nav button.active{color:#b23d4c;font-weight:700}.nav span{display:block;font-size:20px}.view{display:none}.view.active{display:block}textarea{width:100%;min-height:85px;border:1px solid var(--line);border-radius:13px;padding:11px;font:inherit}.history{border-left:3px solid var(--yellow);padding:9px 10px;background:#fffaf0;border-radius:0 10px 10px 0;margin:8px 0}.focus{position:fixed;inset:0;background:rgba(255,248,244,.98);z-index:20;display:none;place-items:end;padding:14px}.focus.show{display:grid}.sheet{width:min(680px,100%);background:#fff;border:1px solid var(--line);border-radius:24px 24px 12px 12px;padding:20px;text-align:center}.timer{font-size:44px;font-weight:800;color:#ca4d5b;margin:12px}.confetti{position:fixed;width:9px;height:9px;border-radius:50%;z-index:30;animation:fall 1.1s forwards}@keyframes fall{to{transform:translateY(70vh) rotate(600deg);opacity:0}}
</style>

<body>
<div class="app">
<section id="today" class="view active">

<div class="card"><div class="top"><h2>今天只处理这些</h2><button class="btn" id="hard">今天很难</button></div><div id="taskList"></div></div>
</section>
<section id="mapView" class="view"><div class="card"><h2>15天地图</h2><div class="map" id="map"></div></div><div class="card"><h2>当前节点</h2><div id="nodeText" class="muted"></div></div></section>
<section id="doneView" class="view"><div class="card"><h2>已完成任务</h2><div class="muted">误点后可在这里撤回。</div><div id="doneList" style="margin-top:10px"></div></div></section>
<section id="reviewView" class="view"><div class="card"><h2>今天留下了什么</h2><textarea id="review" placeholder="哪怕只写一句：今天读了几页，我回来过。"></textarea><button class="btn primary" id="saveReview" style="width:100%;margin-top:9px">保存今天</button></div><div class="card"><h2>过去每天做了什么</h2><div id="history"></div></div></section>
</div>
<nav class="nav"><button class="active" data-view="today"><span>☀️</span>今天</button><button data-view="mapView"><span>🗺️</span>地图</button><button data-view="doneView"><span>✅</span>已完成</button><button data-view="reviewView"><span>📖</span>回顾</button></nav>
<div class="toast" id="toast"><span id="toastText"></span><button id="undo">撤回</button></div>
<div class="focus" id="focus"><div class="sheet"><span class="badge" id="focusTag"></span><div class="timer" id="timer">08:00</div><h2 id="focusTitle"></h2><div class="muted" id="focusDesc"></div><div class="actions"><button class="btn primary" id="finish">完成</button><button class="btn" id="pause">暂停</button></div></div></div>
<script>
const plan=[
['发展心理学','理论地基',[['A','第1章 绪论','研究对象、性质与内容'],['A','第2章 心理发展理论','弗洛伊德、埃里克森、皮亚杰、维果茨基、生态系统'],['B','第3章 研究方法','横断、纵向、聚合交叉']]],
['发展心理学','婴儿发展',[['A','第4章 胎儿发展','遗传、环境与影响因素'],['A','第5章 婴儿心理①','动作、感知觉、认知与语言'],['A','第5章 婴儿心理②','气质、情绪、依恋与社会性']]],
['发展心理学','幼儿与小学',[['A','第6章 幼儿认知','游戏、语言、思维与想象'],['A','第6章 幼儿社会性','情绪、个性、道德与社会性'],['A','第7章 小学儿童','学习、思维、同伴与师生关系']]],
['发展心理学','青少年到老年',[['A','青少年心理','自我意识、同一性、认知与社会性'],['A','成年期','婚恋、职业、人格与认知'],['B','老年期','认知老化、适应与成功老化']]],
['社会心理学','概论与社会化',[['B','第1—3章','界定、理论与研究方法'],['A','第4章 社会化','机制、影响源与结果'],['B','概论框架','画理论—方法—社会化结构图']]],
['社会心理学','社会认知',[['A','第5章 态度','结构、形成、态度与行为'],['A','第6章 社会知觉','印象形成与知觉偏差'],['A','第7—8章','归因、刻板印象与自我概念']]],
['社会心理学','互动与影响',[['A','第10—12章','沟通、人际吸引与人际关系'],['A','第13—14章','助人、旁观者效应与攻击'],['A','第15—18章','从众、服从、劝导与群体']]],
['人格心理学','精神分析与特质',[['B','第1章 概论','人格定义、评价与方法'],['A','第2—3章','弗洛伊德与新精神分析'],['A','第4章 特质理论','奥尔波特、卡特尔、艾森克与大五']]],
['人格心理学','学习、人本与认知',[['A','第6章 行为主义','条件作用、社会学习与自我效能'],['A','第7章 人本主义','马斯洛与罗杰斯'],['B','第5、8、9章','生物、认知与积极人格']]],
['心理咨询','咨询基础',[['A','第1章 概述','定义、区别、发展与伦理'],['A','第2章 咨询关系','关系特征与治疗联盟'],['A','第3—6章','会谈技术、目标、阶段与阻力']]],
['心理咨询','治疗流派',[['A','精神分析疗法','移情、阻抗、自由联想与解释'],['A','行为治疗','脱敏、强化、厌恶与示范'],['A','人本与REBT','核心条件、ABC理论与技术']]],
['变态心理学','基础与精神分裂症',[['A','第1章 概论','异常判定标准与基本概念'],['A','第2—3章','理论模型、评估、分类与诊断'],['A','第4章 精神分裂症','症状、病因与治疗']]],
['变态心理学','情绪、焦虑与人格',[['A','心境障碍','抑郁、躁狂与双相'],['A','焦虑障碍','恐惧、惊恐、强迫与创伤'],['A','人格障碍','分类、特征与鉴别']]],
['变态心理学','其他障碍与临床连接',[['B','躯体形式与分离','表现、鉴别与病因'],['B','进食、物质与心身','主要类型与干预'],['A','临床总连接','把障碍与咨询干预连接起来']]],
['管理心理学','高价值压缩日',[['B','第1—5章','对象、人性假设、知觉与个性'],['A','第6章 激励理论','内容型、过程型与行为改造型'],['A','第8—10章','群体、组织、沟通、文化与领导']]]
];
const KEY='brain_os_public_v1';let s=JSON.parse(localStorage.getItem(KEY)||'{"done":{},"reviews":[],"actions":[],"hard":false,"returns":0}');let day=0,active=null,timerId=null,sec=480;const save=()=>localStorage.setItem(KEY,JSON.stringify(s));const id=(d,i)=>d+'-'+i;function total(){return plan.reduce((n,d)=>n+d[2].length,0)}function doneCount(){return Object.values(s.done).filter(Boolean).length}function todayDone(){return plan[day][2].filter((_,i)=>s.done[id(day,i)]).length}function render(){dateText.textContent='Day '+(day+1)+' · '+plan[day][0]+' · '+plan[day][1];pct.textContent=Math.round(doneCount()/total()*100)+'%';bar.style.width=doneCount()/total()*100+'%';todayCount.textContent=todayDone();returns.textContent=s.returns||0;renderTasks();renderMap();renderDone();renderHistory()}function renderTasks(){taskList.innerHTML='';plan[day][2].forEach((t,i)=>{const k=id(day,i),d=!!s.done[k],el=document.createElement('div');el.className='task'+(d?' done':'');el.innerHTML='<div class="task-head"><input type="checkbox" '+(d?'checked':'')+'><span class="level">'+t[0]+'级</span><div><b>'+t[1]+'</b><p>'+t[2]+'</p></div></div><div class="actions"><button class="btn primary focusBtn">开始小步</button><button class="btn undo '+(d?'':'hidden')+'">撤回完成</button></div>';el.querySelector('input').onchange=e=>setDone(k,t,e.target.checked);el.querySelector('.focusBtn').onclick=()=>startFocus(k,t);el.querySelector('.undo').onclick=()=>setDone(k,t,false);taskList.appendChild(el)})}function setDone(k,t,v){const prev=!!s.done[k];if(prev===v)return;s.done[k]=v;s.actions.push({k,prev,title:t[1]});if(s.actions.length>20)s.actions.shift();save();if(v)confetti();showToast('“'+t[1]+'”'+(v?'已完成':'已撤回'));render()}function showToast(x){toastText.textContent=x;toast.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>toast.classList.remove('show'),5000)}undo.onclick=()=>{const a=s.actions.pop();if(!a)return;s.done[a.k]=a.prev;save();toast.classList.remove('show');render()};function renderMap(){map.innerHTML='';plan.forEach((p,i)=>{const b=document.createElement('button');b.className='dot'+(i===day?' today':'')+(p[2].every((_,j)=>s.done[id(i,j)])?' done':'');b.textContent=i+1;b.onclick=()=>{day=i;render()};map.appendChild(b)});nodeText.textContent='Day '+(day+1)+'：'+plan[day][0]+'｜'+plan[day][1]}function renderDone(){doneList.innerHTML='';let n=0;plan.forEach((p,d)=>p[2].forEach((t,i)=>{const k=id(d,i);if(s.done[k]){n++;const e=document.createElement('div');e.className='task done';e.innerHTML='<b>'+t[1]+'</b><p>Day '+(d+1)+' · '+p[0]+'</p><button class="btn undo" style="width:100%;margin-top:8px">撤回完成</button>';e.querySelector('button').onclick=()=>setDone(k,t,false);doneList.appendChild(e)}}));if(!n)doneList.innerHTML='<div class="muted">还没有已完成任务。</div>'}function startFocus(k,t){active={k,t};s.returns=(s.returns||0)+1;save();sec=s.hard?120:480;focusTitle.textContent=t[1];focusDesc.textContent=t[2];focusTag.textContent=s.hard?'困难模式 · 2分钟':'当前小步 · 8分钟';draw();focus.classList.add('show');clearInterval(timerId);timerId=setInterval(()=>{sec--;draw();if(sec<=0){clearInterval(timerId);timerId=null}},1000)}function draw(){timer.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}finish.onclick=()=>{clearInterval(timerId);focus.classList.remove('show');setDone(active.k,active.t,true)};pause.onclick=()=>{clearInterval(timerId);focus.classList.remove('show');showToast('暂停不是失败，稍后回来')};hard.onclick=()=>{s.hard=!s.hard;save();hard.textContent=s.hard?'困难模式已开':'今天很难';showToast(s.hard?'任务缩成2分钟':'恢复8分钟')};saveReview.onclick=()=>{const x=review.value.trim();if(!x)return;s.reviews=s.reviews.filter(r=>r.day!==day);s.reviews.push({day,text:x});review.value='';save();render();confetti()};function renderHistory(){history.innerHTML=s.reviews.length?'':'<div class="muted">还没有记录。</div>';[...s.reviews].reverse().forEach(r=>{const e=document.createElement('div');e.className='history';e.innerHTML='<b>Day '+(r.day+1)+'</b><div class="muted">'+r.text+'</div>';history.appendChild(e)})}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(b.dataset.view).classList.add('active')});function confetti(){const c=['#f36b78','#f4c85c','#ffb8c1','#fff'];for(let i=0;i<18;i++){const e=document.createElement('i');e.className='confetti';e.style.left=(40+Math.random()*20)+'vw';e.style.top='15vh';e.style.background=c[i%c.length];document.body.appendChild(e);setTimeout(()=>e.remove(),1300)}}render();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
